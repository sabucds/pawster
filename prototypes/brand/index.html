html,body{margin:0;background:#e9e7e4;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1a1d22}
.stage{display:flex;justify-content:center;padding:16px 8px 96px}
.phone{width:360px;height:760px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #1a1d22,0 20px 50px #0004}
.scroll{height:100%;overflow:auto;background:#fff;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.overlay{position:absolute;inset:0;pointer-events:none;background:none!important}.overlay.open{pointer-events:auto}
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#1a1d22;color:#fff;border-radius:999px;padding:6px;box-shadow:0 6px 20px #0005;z-index:99}
.switch button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px}
.switch button:hover{background:#ffffff22}
.switch b{min-width:220px;text-align:center;font-weight:600}
.switch small{display:block;font-weight:400;opacity:.7;font-size:12px}
.i{width:20px;height:20px;flex:none;vertical-align:middle}
[data-v]{min-height:100%}
.manual h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.manual section{padding:20px 16px;border-top:1px solid #0001}
.sw{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sw div{border-radius:8px;padding:8px;font-size:12px;border:1px solid #0001}
.sw code{display:block;font-size:11px;opacity:.85}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:10px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;text-align:center;font-size:10px}
.icons .i{width:24px;height:24px}
.weight{font-size:12px;opacity:.8}
iframe{width:100%;height:560px;border:1px solid #0002;border-radius:8px;background:#fff}
.ph{position:relative;background:#d9d4cc}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<!-- ============ A · Camperito ============ -->
<style id="css-a">
.v-a{--p:#7a4b2a;--p2:#5c3820;--tint:#f1e8e0;--ink:#1c1917;--soft:#57534e;--line:#e7e5e4;--page:#fafaf9;--ok:#166534;--okbg:#dcfce7;--urg:#9b1c1c;--urgbg:#fdeaea;--aged:#8a5a00;--agedbg:#fef3c7;
 background:var(--page);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.v-a .top{position:sticky;top:0;z-index:5;display:flex;justify-content:center;align-items:center;height:52px;background:var(--page);border-bottom:1px solid var(--line)}
.v-a .wm{font:800 24px/1 Nunito,system-ui;color:var(--p);display:flex;gap:6px;align-items:center;letter-spacing:-.02em}
.v-a .wm .i{width:22px;height:22px}
.v-a main{padding:16px}
.v-a h1{font:800 26px/1.15 Nunito,system-ui;margin:4px 0 4px}
.v-a .lede{margin:0 0 14px;color:var(--soft)}
.v-a .search{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--soft)}
.v-a .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.v-a .chip{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px}
.v-a .chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
.v-a .notice{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--agedbg);color:#713f12;margin:12px 0;font-size:15px}
.v-a .card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px #0000000d,0 6px 16px #1c191714;margin:16px 0}
.v-a .card .ph{aspect-ratio:4/3}
.v-a .ib.fav{position:absolute;top:10px;right:10px}
.v-a .badge{position:absolute;left:10px;bottom:10px;display:inline-flex;gap:4px;align-items:center;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#fff}
.v-a .badge.urgent{background:var(--urg);color:#fff}
.v-a .card .body{padding:14px 16px 16px}
.v-a .card h3{margin:0;font:800 22px/1.2 Nunito,system-ui;display:flex;align-items:center;gap:6px}
.v-a .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--soft);font-size:14px;margin:6px 0}
.v-a .meta span{display:inline-flex;gap:4px;align-items:center}.v-a .meta .i{width:16px;height:16px}
.v-a .voice{margin:8px 0 14px;font-style:italic}
.v-a .when{font-size:13px;color:var(--soft);margin:-6px 0 12px}
.v-a .when.stale{color:var(--aged);font-weight:600}

function lum(hex){const c=hex.match(/\w\w/g).map(h=>{let v=parseInt(h,16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return (x+.05)/(y+.05)}
function swatches(el){
  const cs = getComputedStyle(el);
  const page = cs.getPropertyValue('--page').trim();
  return '<div class="sw">' + TOKENS[cur].map(([v,label])=>{
    const hex = cs.getPropertyValue(v).trim();
    const onWhite = ratio(hex,'#ffffff'), onPage = ratio(hex,page);
    const dark = lum(hex) < .4;
    const best = Math.min(onWhite,onPage);
    return `<div style="background:${hex};color:${dark?'#fff':'#1a1d22'}"><b>${label}</b><code>${hex}</code><code>${best.toFixed(1)}:1 ${/Fondo|Foco/.test(label)?'· solo fondo':'sobre fondo '+(best>=4.5?'✓ AA':best>=3?'solo texto grande':'✗')}</code></div>`;

}
async function gz(s){const r=new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('gzip')));return (await r.arrayBuffer()).byteLength}

/* ---------- the digest email, real email HTML ---------- */
const MAIL = {
  a: { get head(){ return `<td align="center" style="background:${T().p};padding:18px;font:800 24px Arial,sans-serif;color:#ffffff">pawster</td>` }, get p(){ return T().p }, r:'16px', btn:'999px', get tint(){ return T().tint }, ok:'#166534', get link(){ return T().p2 } },
  b: { head:`<td style="padding:16px 20px;border-bottom:4px solid #03705f;font:700 20px Arial,sans-serif;color:#1a1d22">Pawster</td>`, p:'#03705f', r:'4px', btn:'4px', tint:'#e6f4f1', ok:'#03705f', link:'#03705f' },
  c: { head:`<td style="padding:20px;background:#fff4ef;font:700 26px Georgia,serif;color:#b4432c">paw<span style="color:#0f6e75">ster</span></td>`, p:'#b4432c', r:'12px', btn:'12px', tint:'#fff4ef', ok:'#0f6e75', link:'#0f6e75' },

function mail(v){

/* ---------- switching: direction A only, three brown tones on a neutral page ---------- */
const TONES = {
  cafe:      { name:'A · Café',      sub:'Marrón medio, página neutra', p:'#7a4b2a', p2:'#5c3820', tint:'#f1e8e0' },
  chocolate: { name:'A · Chocolate', sub:'Marrón oscuro, página neutra', p:'#5b3a29', p2:'#432a1d', tint:'#efe7e2' },
  caramelo:  { name:'A · Caramelo',  sub:'Marrón claro, página neutra', p:'#8a5a33', p2:'#6e4626', tint:'#f5ebe0' },
};
const ORDER = Object.keys(TONES);
let tone = ORDER.includes(new URLSearchParams(location.search).get('tone')) ? new URLSearchParams(location.search).get('tone') : 'cafe';
const T = () => TONES[tone];
async function show(v){
  cur = v;
  for (const el of document.querySelectorAll('[data-v]')) { el.hidden = el.dataset.v !== v; el.innerHTML = ''; el.classList.remove('open'); }
  const el = document.querySelector(`[data-v="${v}"]`);
  el.style.cssText = `--p:${T().p};--p2:${T().p2};--tint:${T().tint}`;
  el.innerHTML = SCREEN[v]();
  el.querySelector('#sw').innerHTML = swatches(el);
  el.querySelector('#mail').srcdoc = mail(v);
  const ov = document.getElementById('overlay'); ov.className = 'overlay' + (v==='c' ? ' v-c' : ''); ov.innerHTML = v==='c' ? SHEET : '';
  document.getElementById('phone').scrollTop = 0;
  document.getElementById('label').innerHTML = `${T().name}<small>${T().sub}</small>`;
  const u = new URL(location); u.searchParams.delete('variant'); u.searchParams.set('tone', tone); history.replaceState(null,'',u);
  const css = document.getElementById('css-'+v).textContent;
  const fontB = { a: 9228, b: 0, c: 10648 }[v];
  const bytes = await gz(css);
  el.querySelector('#wt').textContent = `CSS de esta dirección: ${bytes.toLocaleString('es-VE')} B con gzip. Fuente: ${VARIANTS[v].font}${fontB?`, ${fontB.toLocaleString('es-VE')} B (alfabeto completo; solo la marca serían unos 2 KB)`:', 0 B'}.`;
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip && !chip.classList.contains('js-sheet')) chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') !== 'true');
  const fav = e.target.closest('.ib[aria-label^="Guardar"]'); if (fav) fav.classList.toggle('on');
  const vc = document.getElementById('overlay');
  if (e.target.closest('.js-sheet')) vc.classList.add('open');
  if (e.target.closest('.js-close')) vc.classList.remove('open');
});
const step = d => { tone = ORDER[(ORDER.indexOf(tone)+d+3)%3]; show('a'); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => { if (e.target.matches('input')) return; if (e.key==='ArrowLeft') step(-1); if (e.key==='ArrowRight') step(1); });
show('a');
</script>
